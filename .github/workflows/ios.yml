name: vexa-ios
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Vexa.xcodeproj \
            -scheme Vexa \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ENABLE_BITCODE=NO \
            clean build
      - name: Package unsigned IPA
        run: |
          APP=$(find dd/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "no .app"; find dd -name "*.app"; exit 1; fi
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr Vexa-unsigned.ipa Payload
          ls -lh Vexa-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Vexa-unsigned-ipa
          path: Vexa-unsigned.ipa
          if-no-files-found: error
