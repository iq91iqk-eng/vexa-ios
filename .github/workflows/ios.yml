name: vexa-ios
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Download bundled brain model (offline, no in-app download)
        run: |
          set -o pipefail
          mkdir -p Resources/model
          curl -L --fail --retry 4 --retry-delay 5 -o Resources/model/vexa-brain.gguf \
            "https://huggingface.co/mradermacher/Qwen2.5-1.5B-Instruct-abliterated-GGUF/resolve/main/Qwen2.5-1.5B-Instruct-abliterated.Q4_K_M.gguf"
          ls -lh Resources/model/vexa-brain.gguf
          # تأكّد إنّه ملفّ GGUF حقيقيّ (يبدأ بـ "GGUF") مو صفحة خطأ HTML
          head -c 4 Resources/model/vexa-brain.gguf | grep -q GGUF || { echo "model download corrupt"; exit 1; }
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Trust Swift macros (LLM.swift uses a macro)
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Vexa.xcodeproj \
            -scheme Vexa \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath dd \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ENABLE_BITCODE=NO \
            clean build
      - name: Package unsigned IPA
        run: |
          APP=$(find dd/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "no .app"; find dd -name "*.app"; exit 1; fi
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr Vexa-unsigned.ipa Payload
          ls -lh Vexa-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Vexa-unsigned-ipa
          path: Vexa-unsigned.ipa
          if-no-files-found: error
